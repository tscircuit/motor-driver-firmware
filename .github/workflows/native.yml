name: Native C firmware
on: [push, pull_request]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test_native.sh
        env:
          NATIVE_SANITIZERS: address,undefined
  rp2040-build:
    strategy:
      matrix:
        board: [drv8825, nema23_drv8452]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib ninja-build
      - name: Fetch pinned Pico SDK
        run: |
          git clone --depth 1 --branch 2.3.1 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb
      - name: Build native UF2
        run: |
          cmake -S firmware-c -B build/native -G Ninja -DPICO_BOARD=pico -DMOTOR_BOARD=${{ matrix.board }} -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk"
          cmake --build build/native
      - uses: actions/upload-artifact@v4
        with:
          name: motorcontrol-rp2040-${{ matrix.board }}
          path: build/native/motorcontrol.uf2

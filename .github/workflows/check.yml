name: Check firmware and dashboard
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_firmware_status.cjs
      - run: node --check dist/firmware-status.js
      - run: node --check dist/app.js
      - run: node --check dist/current-chart.js
      - run: node tests/test_current_chart.cjs
      - run: node --check dist/board-controls.js
      - run: node tests/test_board_controls.cjs
      - run: node tests/test_dashboard.cjs
      - run: node tests/test_song.cjs
      - run: node --check dist/gantry.js
      - run: node tests/test_single_motor.cjs
      - run: node tests/test_gantry.cjs
      - run: node tests/test_positions.cjs
      - run: python scripts/build_firmware.py
      - run: python scripts/build_firmware.py --board rp2040_drv8825 --output build/drv8825
